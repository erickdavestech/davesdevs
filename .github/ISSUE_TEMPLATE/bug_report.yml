name: Reporte de error
description: Informa un problema reproducible de la web o del repositorio.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: No publiques contraseñas, tokens, información privada ni vulnerabilidades.
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Explica qué ocurrió y qué esperabas.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. Observar...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL o ruta
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Dispositivo y navegador
      placeholder: Windows 11, Chrome 140
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmación
      options:
        - label: He retirado información privada y este reporte no describe una vulnerabilidad.
          required: true
